<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo.svg" />
  <title>Collection — Pokémon Explorer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/avatar-action.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/community.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <nav class="site-nav glass" id="site-nav">
    <a href="index.html" class="nav__logo"><span>Poké</span>Explorer</a>
    <ul class="nav__menu" id="nav-menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="search.html">Search</a></li>
      <li><a href="games.html">Games</a></li>
      <li><a href="collection.html" class="is-active">Collection</a></li>
      <li><a href="cards.html">Cards</a></li>
      <li><a href="community.html">Community</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <div class="nav__right">
      <div class="nav__points" title="Your PokéPoints">
        <span aria-hidden="true">●</span>
        <span id="nav-points" class="mono">0</span>
      </div>
      <div id="nav-profile" class="nav__profile-slot"></div>
      <button class="nav__toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </nav>

  <main class="container" style="padding-top: calc(var(--nav-height) + 56px); padding-bottom: 100px;">
    <span class="eyebrow">Vault</span>
    <h1 style="margin-bottom: 24px;">Your Collection</h1>

    <div class="trainer-strip glass" id="trainer-strip" hidden></div>

    <div class="collection-progress glass" id="collection-progress">
      <div class="collection-progress__top">
        <span id="progress-label">Loading Pokédex progress...</span>
        <span id="progress-percent" class="mono">0%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="collection-toolbar glass">
      <div class="toolbar-group">
        <label for="sort-select">Sort</label>
        <select id="sort-select" class="toolbar-select">
          <option value="recent">Most recent</option>
          <option value="rarity">Rarity</option>
          <option value="az">Name (A–Z)</option>
        </select>

        <label for="type-select">Type</label>
        <select id="type-select" class="toolbar-select">
          <option value="all">All types</option>
        </select>
      </div>

      <div class="toolbar-group">
        <label style="display:flex; align-items:center; gap:8px; text-transform:none; font-size:0.85rem;">
          <input type="checkbox" id="favorites-only" />
          Favorites only
        </label>
      </div>
    </div>

    <div class="collection-grid" id="collection-grid"></div>
  </main>

  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="js/legacy/collection.js"></script>
</body>
</html>
